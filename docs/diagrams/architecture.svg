<text x="1090" y="188" font-family="Microsoft YaHei,Arial,sans-serif" font-size="12" font-weight="400" fill="#526581">受信JWKS与验证配置</text>
<text x="45" y="1000" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#526581">关键不变量：202后有持久责任；offset不是业务成功；旧租约不能覆盖新状态；HTTP恰好一次需要供应商幂等。</text>
<text x="45" y="1030" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14" font-weight="400" fill="#526581">进程日志与指标接入运维平台（省略横切连线）。本图表示逻辑责任，不代表已部署64分片或跨AZ集群。</text>
