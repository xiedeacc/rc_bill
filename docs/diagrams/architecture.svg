<svg xmlns="http://www.w3.org/2000/svg" width="1800" height="1060" viewBox="0 0 1800 1060"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#526581"/></marker><marker id="recovery" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto" markerUnits="userSpaceOnUse"><path d="M0,0 L8,4 L0,8 Z" fill="#a76d19"/></marker></defs><rect width="1800" height="1060" fill="#f5f7fc"/>
<text x="45" y="52" font-family="Microsoft YaHei,Arial,sans-serif" font-size="30" font-weight="700" fill="#172b45">可靠 API 通知服务 · 组件与责任边界</text>
<text x="45" y="86" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#526581">蓝线：调用与投递    橙色虚线：故障恢复    浅蓝：应用组件    淡紫：持久数据</text>
<rect x="320" y="140" width="1130" height="820" rx="22" fill="#edf2fa" stroke="#92a9c9" stroke-dasharray="8 5"/>
<text x="342" y="173" font-family="Microsoft YaHei,Arial,sans-serif" font-size="16" font-weight="400" fill="#172b45">本服务代码与专属数据 / Topic</text>
<rect x="333" y="425" width="695" height="490" rx="17" fill="#f8fbff" stroke="#85a9cc" stroke-dasharray="5 4"/>
<text x="351" y="451" font-family="Microsoft YaHei,Arial,sans-serif" font-size="15" font-weight="700" fill="#172b45">notification-worker 进程 · dispatch 角色</text>
<rect x="30" y="220" width="245" height="150" rx="13" fill="#fff" stroke="#b5c5da" stroke-width="1.5"/>
<text x="48" y="253" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700" fill="#172b45">业务生产者</text>
<text x="48" y="285" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">业务事件与上游 Outbox</text>
<text x="48" y="310" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">JWT + Idempotency-Key</text>
<text x="48" y="335" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">202不等于供应商成功</text>
<rect x="350" y="220" width="265" height="150" rx="13" fill="#e4f0ff" stroke="#b5c5da" stroke-width="1.5"/>
<text x="368" y="253" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700" fill="#172b45">notification-api</text>
<text x="368" y="285" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">身份 / 租户 / 请求边界</text>
<text x="368" y="310" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">同分片COMMIT后返回202</text>
<text x="368" y="335" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">状态查询与审计重放</text>
<rect x="680" y="220" width="300" height="150" rx="13" fill="#eee8ff" stroke="#b5c5da" stroke-width="1.5"/>
<text x="698" y="253" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700" fill="#172b45">PostgreSQL责任账本</text>
<text x="698" y="285" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">任务 / 幂等 / Outbox</text>
<text x="698" y="310" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">租约 / 尝试 / 重放审计</text>
<text x="698" y="335" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">密文Body与固定拓扑</text>
<rect x="1050" y="220" width="350" height="150" rx="13" fill="#e4f0ff" stroke="#b5c5da" stroke-width="1.5"/>
<text x="1068" y="253" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700" fill="#172b45">Outbox Relay进程</text>
<text x="1068" y="285" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">发布与发布租约恢复</text>
<text x="1068" y="310" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">确认后CAS；失败允许重发</text>
<text x="1068" y="335" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">终态保留期清理</text>
<rect x="1500" y="220" width="260" height="150" rx="13" fill="#fff" stroke="#b5c5da" stroke-width="1.5"/>
<text x="1518" y="253" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700" fill="#172b45">外部身份平台</text>
<text x="1518" y="285" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">JWT签发由平台负责</text>
<text x="1518" y="310" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">本服务读取受信公钥/JWKS</text>
<text x="1518" y="335" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">不实现账户或登录系统</text>
<rect x="1050" y="475" width="350" height="150" rx="13" fill="#eee8ff" stroke="#b5c5da" stroke-width="1.5"/>
<text x="1068" y="508" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700" fill="#172b45">Kafka持久事件流</text>
<text x="1068" y="540" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">dispatch / dead / quarantine</text>
<text x="1068" y="565" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">RF3 / minISR2 / offset</text>
<text x="1068" y="590" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">数据平台管理KRaft集群</text>
<rect x="680" y="475" width="300" height="150" rx="13" fill="#e4f0ff" stroke="#b5c5da" stroke-width="1.5"/>
<text x="698" y="508" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700" fill="#172b45">消费与持久移交</text>
<text x="698" y="540" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">平台线程poll</text>
<text x="698" y="565" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">按任务版本和epoch领取</text>
<text x="698" y="590" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">持久租约后才推进offset</text>
<rect x="350" y="475" width="265" height="150" rx="13" fill="#e4f0ff" stroke="#b5c5da" stroke-width="1.5"/>
<text x="368" y="508" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700" fill="#172b45">有界HTTP执行器</text>
<text x="368" y="540" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">虚拟线程与执行名额</text>
<text x="368" y="565" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">DNS/IP策略与总deadline</text>
<text x="368" y="590" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">稳定deliveryKey</text>
<rect x="30" y="475" width="245" height="150" rx="13" fill="#fff" stroke="#b5c5da" stroke-width="1.5"/>
<text x="48" y="508" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700" fill="#172b45">外部供应商</text>
<text x="48" y="540" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">广告 / CRM / 库存API</text>
<text x="48" y="565" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">外部业务原子幂等</text>
<text x="48" y="590" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">不实现供应商业务</text>
<rect x="680" y="755" width="300" height="150" rx="13" fill="#fff3de" stroke="#b5c5da" stroke-width="1.5"/>
<text x="698" y="788" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700" fill="#172b45">投递租约恢复</text>
<text x="698" y="820" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">过期lease → UNKNOWN</text>
<text x="698" y="845" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">同事务产生下一代Outbox</text>
<text x="698" y="870" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">TTL与次数预算约束</text>
<rect x="350" y="755" width="265" height="150" rx="13" fill="#e4f0ff" stroke="#b5c5da" stroke-width="1.5"/>
<text x="368" y="788" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700" fill="#172b45">平台接入客户端</text>
<text x="368" y="820" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">申请/释放共享许可</text>
<text x="368" y="845" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">读取凭证引用，不转发JWT</text>
<text x="368" y="870" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">控制面与供应商策略分离</text>
<rect x="1500" y="755" width="260" height="150" rx="13" fill="#fff" stroke="#b5c5da" stroke-width="1.5"/>
<text x="1518" y="788" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700" fill="#172b45">共享配额与密钥平台</text>
<text x="1518" y="820" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">原子速率/并发裁决</text>
<text x="1518" y="845" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">故障时不新增发送许可</text>
<text x="1518" y="870" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">本仓库不实现平台服务端</text>
<rect x="30" y="755" width="245" height="150" rx="13" fill="#fff" stroke="#b5c5da" stroke-width="1.5"/>
<text x="48" y="788" font-family="Microsoft YaHei,Arial,sans-serif" font-size="19" font-weight="700" fill="#172b45">授权运维用户</text>
<text x="48" y="820" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">状态查询 / 审计重放</text>
<text x="48" y="845" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">按租户与权限隔离</text>
<text x="48" y="870" font-family="Microsoft YaHei,Arial,sans-serif" font-size="14.5" font-weight="400" fill="#172b45">稳定幂等键与风险确认</text>
