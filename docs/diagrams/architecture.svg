<svg xmlns="http://www.w3.org/2000/svg" width="1500" height="1040" viewBox="0 0 1500 1040"><defs><marker id="arrow" markerWidth="9" markerHeight="9" refX="8" refY="4" orient="auto"><path d="M0,0 L8,4 L0,8" fill="none" stroke="#526581" stroke-width="1.6"/></marker></defs><style>text{font-family:Microsoft YaHei,Arial,sans-serif;fill:#172b45}.title{font-size:30px;font-weight:700}.sub{font-size:16px;fill:#526581}.node{font-size:20px;font-weight:700}.body{font-size:15px}.label{font-size:14px;fill:#405772}</style><rect width="1500" height="1040" fill="#f5f7fc"/>
<text x="45" y="55" font-size="30" font-weight="700" font-family="Microsoft YaHei" fill="#172b45">可靠 API 通知服务 · 容器与可靠性边界</text>
<text x="45" y="88" font-size="16" font-family="Microsoft YaHei" fill="#172b45">实线：正常投递     虚线：恢复 / 结果写回     蓝色：本服务进程     紫色：持久基础设施</text>
<rect x="320" y="145" width="1130" height="810" rx="22" fill="#edf2fa" stroke="#92a9c9" stroke-dasharray="8 5"/>
<text x="342" y="178" font-size="16" font-family="Microsoft YaHei" fill="#172b45">本服务拥有的运行与数据边界</text>
<rect x="30" y="220" width="245" height="150" rx="14" fill="#fff" stroke="#b9c8dd" stroke-width="1.5"/>
<text x="48" y="254" font-size="20" font-weight="700" font-family="Microsoft YaHei" fill="#172b45">内部业务生产者</text>
<text x="48" y="286" font-size="15" font-family="Microsoft YaHei" fill="#172b45">业务事件与上游 Outbox</text>
<text x="48" y="311" font-size="15" font-family="Microsoft YaHei" fill="#172b45">JWT + Idempotency-Key</text>
<text x="48" y="336" font-size="15" font-family="Microsoft YaHei" fill="#172b45">202 ≠ 供应商已成功</text>
<rect x="350" y="220" width="265" height="150" rx="14" fill="#e4f0ff" stroke="#b9c8dd" stroke-width="1.5"/>
<text x="368" y="254" font-size="20" font-weight="700" font-family="Microsoft YaHei" fill="#172b45">API / 身份与契约</text>
<text x="368" y="286" font-size="15" font-family="Microsoft YaHei" fill="#172b45">验证身份、租户、请求边界</text>
<text x="368" y="311" font-size="15" font-family="Microsoft YaHei" fill="#172b45">同分片事务提交后响应202</text>
<text x="368" y="336" font-size="15" font-family="Microsoft YaHei" fill="#172b45">稳定路由与请求指纹</text>
<rect x="680" y="220" width="300" height="150" rx="14" fill="#eee8ff" stroke="#b9c8dd" stroke-width="1.5"/>
<text x="698" y="254" font-size="20" font-weight="700" font-family="Microsoft YaHei" fill="#172b45">PostgreSQL / MyBatis</text>
<text x="698" y="286" font-size="15" font-family="Microsoft YaHei" fill="#172b45">任务 + 幂等 + Outbox 原子写</text>
<text x="698" y="311" font-size="15" font-family="Microsoft YaHei" fill="#172b45">租约 / attempt / 重放审计</text>
<text x="698" y="336" font-size="15" font-family="Microsoft YaHei" fill="#172b45">Body 加密；按逻辑槽路由</text>
<rect x="1050" y="220" width="350" height="150" rx="14" fill="#e4f0ff" stroke="#b9c8dd" stroke-width="1.5"/>
<text x="1068" y="254" font-size="20" font-weight="700" font-family="Microsoft YaHei" fill="#172b45">Outbox Relay</text>
<text x="1068" y="286" font-size="15" font-family="Microsoft YaHei" fill="#172b45">短事务领取发布租约</text>
<text x="1068" y="311" font-size="15" font-family="Microsoft YaHei" fill="#172b45">Kafka确认后CAS标记已发布</text>
<text x="1068" y="336" font-size="15" font-family="Microsoft YaHei" fill="#172b45">允许重发；eventId保持不变</text>
<rect x="1050" y="475" width="350" height="150" rx="14" fill="#eee8ff" stroke="#b9c8dd" stroke-width="1.5"/>
<text x="1068" y="509" font-size="20" font-weight="700" font-family="Microsoft YaHei" fill="#172b45">Kafka / 持久分发</text>
<text x="1068" y="541" font-size="15" font-family="Microsoft YaHei" fill="#172b45">幂等Producer · RF3 · minISR2</text>
<text x="1068" y="566" font-size="15" font-family="Microsoft YaHei" fill="#172b45">分区 / lag / offset / 隔离队列</text>
<text x="1068" y="591" font-size="15" font-family="Microsoft YaHei" fill="#172b45">消息只带索引，不携带凭证</text>
<rect x="680" y="475" width="300" height="150" rx="14" fill="#e4f0ff" stroke="#b9c8dd" stroke-width="1.5"/>
<text x="698" y="509" font-size="20" font-weight="700" font-family="Microsoft YaHei" fill="#172b45">Worker / 持久移交</text>
<text x="698" y="541" font-size="15" font-family="Microsoft YaHei" fill="#172b45">平台线程 poll</text>
<text x="698" y="566" font-size="15" font-family="Microsoft YaHei" fill="#172b45">按任务 + epoch CAS领取</text>
<text x="698" y="591" font-size="15" font-family="Microsoft YaHei" fill="#172b45">持久租约后才推进offset</text>
<rect x="350" y="475" width="265" height="150" rx="14" fill="#e4f0ff" stroke="#b9c8dd" stroke-width="1.5"/>
<text x="368" y="509" font-size="20" font-weight="700" font-family="Microsoft YaHei" fill="#172b45">有界 HTTP 执行器</text>
<text x="368" y="541" font-size="15" font-family="Microsoft YaHei" fill="#172b45">虚拟线程 + 共享许可</text>
<text x="368" y="566" font-size="15" font-family="Microsoft YaHei" fill="#172b45">DNS/IP策略 · 总deadline</text>
<text x="368" y="591" font-size="15" font-family="Microsoft YaHei" fill="#172b45">稳定 deliveryKey</text>
<rect x="30" y="475" width="245" height="150" rx="14" fill="#fff" stroke="#b9c8dd" stroke-width="1.5"/>
<text x="48" y="509" font-size="20" font-weight="700" font-family="Microsoft YaHei" fill="#172b45">外部供应商 API</text>
<text x="48" y="541" font-size="15" font-family="Microsoft YaHei" fill="#172b45">广告 / CRM / 库存</text>
<text x="48" y="566" font-size="15" font-family="Microsoft YaHei" fill="#172b45">外部业务原子幂等</text>
<text x="48" y="591" font-size="15" font-family="Microsoft YaHei" fill="#172b45">不实现供应商业务</text>
<rect x="680" y="755" width="300" height="150" rx="14" fill="#fff3de" stroke="#b9c8dd" stroke-width="1.5"/>
<text x="698" y="789" font-size="20" font-weight="700" font-family="Microsoft YaHei" fill="#172b45">恢复 / 清理</text>
<text x="698" y="821" font-size="15" font-family="Microsoft YaHei" fill="#172b45">过期租约 → UNKNOWN</text>
<text x="698" y="846" font-size="15" font-family="Microsoft YaHei" fill="#172b45">同事务产生下一代Outbox</text>
<text x="698" y="871" font-size="15" font-family="Microsoft YaHei" fill="#172b45">TTL / 次数 / 保留期约束</text>
<rect x="350" y="755" width="265" height="150" rx="14" fill="#fff" stroke="#b9c8dd" stroke-width="1.5"/>
<text x="368" y="789" font-size="20" font-weight="700" font-family="Microsoft YaHei" fill="#172b45">运维与审计</text>
<text x="368" y="821" font-size="15" font-family="Microsoft YaHei" fill="#172b45">状态查询 / 人工重放</text>
<text x="368" y="846" font-size="15" font-family="Microsoft YaHei" fill="#172b45">指标 / 追踪 / 告警</text>
<text x="368" y="871" font-size="15" font-family="Microsoft YaHei" fill="#172b45">不可静默丢弃失败任务</text>
<rect x="1050" y="755" width="350" height="150" rx="14" fill="#fff" stroke="#b9c8dd" stroke-width="1.5"/>
<text x="1068" y="789" font-size="20" font-weight="700" font-family="Microsoft YaHei" fill="#172b45">外部平台客户端</text>
<text x="1068" y="821" font-size="15" font-family="Microsoft YaHei" fill="#172b45">身份签发 / 密钥管理 / 配额</text>
<text x="1068" y="846" font-size="15" font-family="Microsoft YaHei" fill="#172b45">仅接入客户端，不重写平台</text>
<text x="1068" y="871" font-size="15" font-family="Microsoft YaHei" fill="#172b45">全局配额故障时停止新增许可</text>
<polyline points="275,280 350,280" fill="none" stroke="#526581" stroke-width="2" marker-end="url(#arrow)"/>
<text x="285" y="267" font-size="12" font-family="Microsoft YaHei" fill="#172b45">① 提交</text>
<polyline points="615,280 680,280" fill="none" stroke="#526581" stroke-width="2" marker-end="url(#arrow)"/>
<text x="613" y="260" font-size="12" font-family="Microsoft YaHei" fill="#172b45">② COMMIT</text>
<polyline points="980,280 1050,280" fill="none" stroke="#526581" stroke-width="2" marker-end="url(#arrow)"/>
<text x="987" y="264" font-size="12" font-family="Microsoft YaHei" fill="#172b45">③ 租赁</text>
<polyline points="1225,370 1225,475" fill="none" stroke="#526581" stroke-width="2" marker-end="url(#arrow)"/>
<text x="1238" y="420" font-size="12" font-family="Microsoft YaHei" fill="#172b45">④ 发布并确认</text>
<polyline points="1050,545 980,545" fill="none" stroke="#526581" stroke-width="2" marker-end="url(#arrow)"/>
<text x="983" y="530" font-size="12" font-family="Microsoft YaHei" fill="#172b45">⑤ 消费</text>
<polyline points="680,545 615,545" fill="none" stroke="#526581" stroke-width="2" marker-end="url(#arrow)"/>
<text x="616" y="530" font-size="12" font-family="Microsoft YaHei" fill="#172b45">⑥ 执行</text>
<polyline points="350,545 275,545" fill="none" stroke="#526581" stroke-width="2" marker-end="url(#arrow)"/>
<text x="280" y="530" font-size="12" font-family="Microsoft YaHei" fill="#172b45">⑦ HTTP</text>
<polyline points="830,475 830,370" fill="none" stroke="#526581" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="845" y="425" font-size="12" font-family="Microsoft YaHei" fill="#172b45">持久claim / CAS结果</text>
<polyline points="830,755 830,625" fill="none" stroke="#526581" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="844" y="698" font-size="12" font-family="Microsoft YaHei" fill="#172b45">恢复租约</text>
<polyline points="980,825 1015,825 1015,395 940,395 940,370" fill="none" stroke="#526581" stroke-width="2" marker-end="url(#arrow)" stroke-dasharray="7 5"/>
<text x="1025" y="700" font-size="12" font-family="Microsoft YaHei" fill="#172b45">⑧ 重试Outbox</text>
<text x="45" y="985" font-size="16" font-family="Microsoft YaHei" fill="#172b45">不变量：202后有持久责任；offset不是业务成功；旧租约不能覆盖新状态；外部恰好一次需要供应商幂等。</text>
<polygon points="350.0,280.0 340.0,284.0 340.0,276.0" fill="#526581"/><polygon points="680.0,280.0 670.0,284.0 670.0,276.0" fill="#526581"/><polygon points="1050.0,280.0 1040.0,284.0 1040.0,276.0" fill="#526581"/><polygon points="1225.0,475.0 1221.0,465.0 1229.0,465.0" fill="#526581"/><polygon points="980.0,545.0 990.0,541.0 990.0,549.0" fill="#526581"/><polygon points="615.0,545.0 625.0,541.0 625.0,549.0" fill="#526581"/><polygon points="275.0,545.0 285.0,541.0 285.0,549.0" fill="#526581"/><polygon points="830.0,370.0 834.0,380.0 826.0,380.0" fill="#526581"/><polygon points="830.0,625.0 834.0,635.0 826.0,635.0" fill="#526581"/><polygon points="940.0,370.0 944.0,380.0 936.0,380.0" fill="#526581"/></svg>