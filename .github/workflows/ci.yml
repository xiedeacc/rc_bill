name: notification-verification
on:
  push:
    branches: [master, 'implementation/**']
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
concurrency:
  group: verification-${{ github.ref }}
  cancel-in-progress: false
jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 25
    permissions:
      contents: read
    env:
      TEST_PG_URL: jdbc:postgresql://localhost:15432/notification
      TEST_PG_USER: notification
      TEST_PG_PASSWORD: notification_test
      TEST_KAFKA_BOOTSTRAP: localhost:19092,localhost:19093,localhost:19094
      TEST_KAFKA_REPLICATION: '3'
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/setup-java@c5195efecf7bdfc987ee8bae7a71cb8b11521c00
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
      - name: Start isolated PostgreSQL and three Kafka brokers
        id: infrastructure
        run: docker compose -f compose.test.yaml up -d --wait --wait-timeout 180
      - name: Validate contracts and documentation links
        run: |
          python3 -m venv .ci-python
          .ci-python/bin/pip install -r requirements-dev.txt
          .ci-python/bin/python scripts/validate-contracts.py
          .ci-python/bin/python scripts/test_acceptance_benchmark.py
      - name: Unit and real infrastructure tests
        id: tests
        run: |
          set -o pipefail
          ./mvnw -B -ntp -Pintegration clean verify 2>&1 | tee ci-maven.log
      - name: Build non-root runtime images
        id: images
        run: |
          set -o pipefail
          { docker build --build-arg MODULE=notification-api -t rc-bill-api:verified .
            docker build --build-arg MODULE=notification-worker -t rc-bill-worker:verified .
          } 2>&1 | tee ci-images.log
      - name: Verify actual runtime API and Worker processes
        id: runtime_demo
        run: bash scripts/demo-smoke.sh
      - name: Compare baseline and candidate on the same runner
        id: performance
        if: github.ref == 'refs/heads/implementation/acceptance-performance'
        run: bash scripts/compare-acceptance.sh db04ef68fd9b1b4e854a928b957fe99fee50a82a
      - name: Verify read-only non-root container startup
        id: container_smoke
        run: bash scripts/container-smoke.sh 2>&1 | tee ci-image-smoke.log
      - name: Collect verification evidence
        if: always()
        env:
          TEST_OUTCOME: ${{ steps.tests.outcome }}
          INFRA_OUTCOME: ${{ steps.infrastructure.outcome }}
          IMAGE_OUTCOME: ${{ steps.images.outcome }}
          CONTAINER_OUTCOME: ${{ steps.container_smoke.outcome }}
          RUNTIME_OUTCOME: ${{ steps.runtime_demo.outcome }}
          PERFORMANCE_OUTCOME: ${{ steps.performance.outcome }}
        run: |
          docker compose -f compose.test.yaml logs --no-color > ci-services.log 2>&1 || true
          python3 scripts/collect-ci-evidence.py
      - uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        if: always()
        with:
          name: verification-${{ github.sha }}
          path: ci-evidence-output/
          retention-days: 14
      - name: Remove only the isolated test services
        if: always()
        run: docker compose -f compose.test.yaml down -v
  evidence:
    needs: verify
    if: always() && github.event_name == 'push'
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          name: verification-${{ github.sha }}
          path: ci-evidence-output/
      - name: Publish machine-readable evidence for SSH-only review
        run: |
          report="$RUNNER_TEMP/rc-bill-ci-evidence"
          if git fetch origin refs/heads/ci-evidence; then
            git worktree add -b ci-evidence "$report" FETCH_HEAD
          else
            git worktree add -b ci-evidence "$report" HEAD
            git -C "$report" rm -r --ignore-unmatch . >/dev/null
          fi
          mkdir -p "$report/runs/$GITHUB_SHA"
          cp -R ci-evidence-output/. "$report/runs/$GITHUB_SHA/"
          cp ci-evidence-output/summary.json "$report/latest.json"
          git -C "$report" config user.name 'github-actions[bot]'
          git -C "$report" config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git -C "$report" add .
          git -C "$report" commit -m "ci: evidence for $GITHUB_SHA" || true
          git -C "$report" push origin HEAD:ci-evidence
