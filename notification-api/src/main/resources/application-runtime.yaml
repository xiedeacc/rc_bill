spring:
  autoconfigure:
    exclude:
      - org.springframework.boot.security.autoconfigure.UserDetailsServiceAutoConfiguration
      - org.springframework.boot.jdbc.autoconfigure.DataSourceAutoConfiguration
  kafka:
    listener:
      auto-startup: false
    admin:
      auto-create: false
server:
  max-http-request-header-size: 16KB
  tomcat:
    connection-timeout: 5s
    max-swallow-size: 0B
management:
  endpoint:
    health:
      group:
        readiness:
          include: readinessState,ledger
notification:
  database:
    urls: ${PG_URL}
    user: ${PG_USER}
    password: ${PG_PASSWORD}
    migrate: ${DB_MIGRATE:false}
  encryption-key: ${NOTIFICATION_ENCRYPTION_KEY}
  destinations-file: ${DESTINATIONS_FILE}
  kafka:
    partitions: ${KAFKA_PARTITIONS:16}
  security:
    issuer: ${JWT_ISSUER}
    audience: ${JWT_AUDIENCE}
