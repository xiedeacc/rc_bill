apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-config
  namespace: notifications
data:
  SPRING_PROFILES_ACTIVE: runtime
  SERVER_ADDRESS: 0.0.0.0
  MANAGEMENT_SERVER_PORT: '9090'
  MANAGEMENT_ENDPOINTS_WEB_EXPOSURE_INCLUDE: health,prometheus
  KAFKA_PARTITIONS: '16'
  DB_MIGRATE: 'false'
  DESTINATIONS_FILE: /etc/notification/destinations.json
  NOTIFICATION_HTTP_MAXIMUM: '128'
  NOTIFICATION_API_MAXIMUM_IN_FLIGHT: '512'
  NOTIFICATION_ADMISSION_MAXIMUM_PENDING: '50000'
---
apiVersion: v1
kind: ConfigMap
metadata:
  name: notification-destinations
  namespace: notifications
data:
  # Populate reviewed versioned destinations before enabling business traffic.
  # No production credentials or permissive example URLs are shipped.
  destinations.json: '[]'
