apiVersion: apps/v1
kind: Deployment
metadata:
  name: notification-worker
  namespace: notifications
spec:
  replicas: 3
  strategy:
    rollingUpdate: {maxUnavailable: 0, maxSurge: 1}
  selector:
    matchLabels: {app: notification-worker}
  template:
    metadata:
      labels: {app: notification-worker, app.kubernetes.io/part-of: rc-bill}
    spec:
      terminationGracePeriodSeconds: 45
      automountServiceAccountToken: false
      imagePullSecrets: [{name: ghcr-pull}]
      securityContext: {runAsNonRoot: true, runAsUser: 10001, runAsGroup: 10001, fsGroup: 10001, seccompProfile: {type: RuntimeDefault}}
      topologySpreadConstraints:
        - maxSkew: 1
          topologyKey: topology.kubernetes.io/zone
          whenUnsatisfiable: DoNotSchedule
          labelSelector: {matchLabels: {app: notification-worker}}
      containers:
        - name: worker
          image: rc-bill-worker:verified
          ports: [{name: management, containerPort: 9090}]
          envFrom: [{configMapRef: {name: notification-config}}, {secretRef: {name: notification-worker-runtime}}]
          env: [{name: NOTIFICATION_ROLE, value: all}]
          resources: {requests: {cpu: '1', memory: 1Gi}, limits: {cpu: '4', memory: 4Gi}}
          securityContext: {allowPrivilegeEscalation: false, readOnlyRootFilesystem: true, capabilities: {drop: [ALL]}}
          startupProbe: {httpGet: {path: /actuator/health/liveness, port: management}, periodSeconds: 2, failureThreshold: 60}
          livenessProbe: {httpGet: {path: /actuator/health/liveness, port: management}, periodSeconds: 10, failureThreshold: 3}
          readinessProbe: {httpGet: {path: /actuator/health/readiness, port: management}, periodSeconds: 5, failureThreshold: 2}
          volumeMounts: [{name: tmp, mountPath: /tmp}, {name: destinations, mountPath: /etc/notification, readOnly: true}, {name: certificates, mountPath: /etc/certificates, readOnly: true}]
      volumes:
        - name: tmp
          emptyDir: {sizeLimit: 256Mi}
        - name: destinations
          configMap: {name: notification-destinations}
        - name: certificates
          secret: {secretName: notification-certificates, optional: true}
---
apiVersion: policy/v1
kind: PodDisruptionBudget
metadata:
  name: notification-worker
  namespace: notifications
spec:
  minAvailable: 2
  selector: {matchLabels: {app: notification-worker}}
